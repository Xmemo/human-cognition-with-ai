name: Deploy research website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'research/**'
      - 'weekly/**'
      - 'methodology/**'
      - 'topics/**'
      - 'people/**'
      - 'references/**'
      - 'site/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SITE_URL: https://xmemo.github.io
  BASE_PATH: /human-cognition-with-ai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and verify for project-site base path
        working-directory: site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
